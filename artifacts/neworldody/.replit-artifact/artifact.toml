kind = "web"
previewPath = "/"
title = "Neworldody"
version = "1.0.0"
id = "artifacts/neworldody"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20774

[services.development]
run = "pnpm --filter @workspace/neworldody run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neworldody", "run", "build" ]
serve = "static"
publicDir = "artifacts/neworldody/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20774"
BASE_PATH = "/"
